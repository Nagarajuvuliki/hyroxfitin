<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Social Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(120deg, #2980b9, #6dd5fa);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 25px;
            color: #333;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .submit-btn {
            background-color: #2980b9;
            color: #fff;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .login-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            text-decoration: none;
            text-align: center;
        }
        .google { background-color: #db4437; }
        .facebook { background-color: #3b5998; }
        .twitter { background-color: #1da1f2; }

        .divider {
            margin: 20px 0;
            color: #aaa;
            font-size: 14px;
        }

        .register-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link a {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login to Your Account</h2>

        <form method="POST" action="">
            {% csrf_token %}
            <input type="text" name="username" class="input-field" placeholder="Username" required>
            <input type="password" name="password" class="input-field" placeholder="Password" required>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="">Register</a>
        </div>

        <div class="divider">or login with</div>

        <a href="{% url 'social:begin' 'google-oauth2' %}?next=/" class="login-btn google">Google</a>
        <a href="{% url 'social:begin' 'facebook' %}?next=/" class="login-btn facebook">Facebook</a>
        <!-- <a href="{% url 'social:begin' 'twitter' %}?next=/" class="login-btn twitter">Twitter</a> -->
    </div>
</body>
</html>
