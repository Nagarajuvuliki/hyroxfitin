<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MyWebsite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
    }
    .header, .footer {
      background-color: #343a40;
      color: white;
    }
    .navbar .nav-link {
      color: white !important;
    }
    .form-section {
      min-height: 80vh;
    }
    .left-image {
      background: url('http://127.0.0.1:8000/static/rimage.png') center/cover no-repeat;
      position: relative;
      color: white;
      min-height: 100%;
    }
    .overlay-text {
      position: absolute;
      bottom: 30px;
      left: 30px;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      max-width: 80%;
    }
    .form-container {
      padding: 40px;
      max-width: 400px;
      margin: 0 auto;
    }
    .form-control-wrapper {
      position: relative;
    }
    .form-control-wrapper .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
      z-index: 2;
    }
    .form-control-wrapper input {
      padding-right: 40px;
    }
    .google-btn {
      background-color: #fff;
      color: #000;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .google-btn img {
      width: 20px;
      height: 20px;
    }
    .separator {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }
    .separator::before,
    .separator::after {
      content: "";
      position: absolute;
      height: 1px;
      background: #ccc;
      top: 50%;
      width: 45%;
    }
    .separator::before {
      left: 0;
    }
    .separator::after {
      right: 0;
    }
    .separator span {
      background: #f8f9fa;
      padding: 0 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header class="header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h3 class="mb-0">MyWebsite</h3>
      <nav>
        <a class="nav-link d-inline-block me-3" href="#">Home</a>
        <a class="nav-link d-inline-block me-3" href="#">About Us</a>
        <a class="nav-link d-inline-block" href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container-fluid form-section d-flex flex-wrap">
    <!-- Left Image -->
    <div class="col-md-7 p-0 left-image">
      <div class="overlay-text">
        <h2>Welcome Back</h2>
        <p>Login to continue exploring features of MyWebsite.</p>
      </div>
    </div>

    <!-- Right Form -->
    <div class="col-md-5 bg-light d-flex align-items-center">
      <form class="form-container w-100" id="loginForm">
        <h2 class="mb-4">Login</h2>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3 form-control-wrapper">
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-password" toggle="#loginPassword"></i>
        </div>
        <div class="mb-3 text-end">
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div class="separator"><span>or</span></div>
        <button type="button" class="btn google-btn w-100">
          <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" alt="Gmail icon">
          Login with Gmail
        </button>
      </form>
    </div>
  </main>

  <footer class="footer text-center py-3">
    <p>&copy; 2025 MyWebsite. <a href="#" class="text-white">Privacy</a> | <a href="#" class="text-white">Support</a></p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".toggle-password").forEach(function (eye) {
        eye.addEventListener("click", function () {
          const input = document.querySelector(eye.getAttribute("toggle"));
          const type = input.getAttribute("type") === "password" ? "text" : "password";
          input.setAttribute("type", type);
          eye.classList.toggle("fa-eye");
          eye.classList.toggle("fa-eye-slash");
        });
      });
    });
  </script>
</body>
</html>
