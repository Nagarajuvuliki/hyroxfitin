{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - MyWebsite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
    }
    .header, .footer {
      background-color: #343a40;
      color: white;
    }
    .navbar .nav-link {
      color: white !important;
    }
    .dashboard-section {
      height: 80vh;
      background: url('http://127.0.0.1:8000/static/dimage.jpg') center/cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .overlay-text {
      /* background: rgba(0, 0, 0, 0.6); */
      padding: 40px;
      border-radius: 12px;
      max-width: 700px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="header py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h3 class="mb-0">MyWebsite</h3>
      <nav>
        <a class="nav-link d-inline-block me-3" href="#">Home</a>
        <a class="nav-link d-inline-block me-3" href="#">About Us</a>
        <a class="nav-link d-inline-block" href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main class="dashboard-section">
    <div class="overlay-text">
      <h1 style="background: rgba(0, 0, 0, 0.6);">Welcome {{ username }}! Let’s Crush This.</h1>
      <h1 style="background: rgba(0, 0, 0, 0.6);;">Let's find your perfect fitness partner.</h1>
    <a href="/create-profile/" class="btn btn-warning mt-3">Create Profile</a>
    </div>
  </main>

  <footer class="footer text-center py-3">
    <p>&copy; 2025 MyWebsite. <a href="#" class="text-white">Privacy</a> | <a href="#" class="text-white">Support</a></p>
  </footer>
</body>
</html>
