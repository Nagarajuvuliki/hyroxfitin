<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Django Social Auth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #6c5ce7;
      --secondary: #00cec9;
      --danger: #d63031;
      --success: #00b894;
      --bg: #f5f6fa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .register-container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .register-container h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 25px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      outline: none;
    }

    .otp-btn {
      background-color: var(--secondary);
      color: white;
      padding: 10px;
      font-size: 13px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .otp-btn:hover {
      background-color: #00bcd4;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 500;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background-color: #5e50d4;
    }

    .error-message {
      font-size: 13px;
      margin-top: 6px;
    }

    .valid {
      color: var(--success);
    }

    .invalid {
      color: var(--danger);
    }

    .toggle-password {
      position: relative;
    }

    .toggle-password .eye-icon {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      color: #999;
    }

    @media (max-width: 600px) {
      .register-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">FitConnect</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
      </ul>
    </div>
  </div>
</nav>
  <div class="register-container">
    <h2>Create Account</h2>
    <form method="POST" action="" onsubmit="return validateFinal();">
      {% csrf_token %}
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" required>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" required>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="text" name="email_or_mobile" required>
        <button type="button" class="otp-btn">Send OTP</button>
      </div>

      <div class="form-group">
        <label>Enter OTP</label>
        <input type="text" name="otp" required>
      </div>

      <div class="form-group toggle-password">
        <label>Password</label>
        <input type="password" id="password" name="password" required>
        <span class="eye-icon" onclick="toggleVisibility('password')">👁️</span>
        <div id="password-error" class="error-message"></div>
      </div>

      <div class="form-group toggle-password">
        <label>Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <span class="eye-icon" onclick="toggleVisibility('confirm_password')">👁️</span>
        <div id="confirm-error" class="error-message"></div>
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>
    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
    Already have an account?
    <a href="/" style="color: #007BFF; text-decoration: none; font-weight: bold;">Login here</a>
</p>
  </div>

  <script>
    const passwordField = document.getElementById('password');
    const confirmField = document.getElementById('confirm_password');
    const passwordError = document.getElementById('password-error');
    const confirmError = document.getElementById('confirm-error');

    const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    passwordField.addEventListener('input', () => {
      const password = passwordField.value;

      if (!passwordRegex.test(password)) {
        passwordError.textContent = 'At least 8 characters, 1 uppercase, 1 number, 1 special char.';
        passwordError.className = 'error-message invalid';
      } else {
        passwordError.textContent = 'Strong password ✅';
        passwordError.className = 'error-message valid';
      }

      checkPasswordMatch();
    });

    confirmField.addEventListener('input', checkPasswordMatch);

    function checkPasswordMatch() {
      const password = passwordField.value;
      const confirm = confirmField.value;

      if (confirm && password !== confirm) {
        confirmError.textContent = 'Passwords do not match ❌';
        confirmError.className = 'error-message invalid';
      } else if (confirm && password === confirm) {
        confirmError.textContent = 'Passwords match ✅';
        confirmError.className = 'error-message valid';
      } else {
        confirmError.textContent = '';
      }
    }

    function validateFinal() {
      return passwordRegex.test(passwordField.value) && passwordField.value === confirmField.value;
    }

    function toggleVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
